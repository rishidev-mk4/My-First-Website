<!DOCTYPE html>
<html>
<head>
      <title>Sample Meta Tags Page</title>    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="This webpage demonstrates the use of various meta tags including character encoding, viewport settings, SEO information, and cache control.">
    <meta name="keywords" content="HTML, meta tags, SEO, viewport, cache control, example">
    
    <!-- Cache control meta tags -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
</head>
<body>
    <img src="car.jpg" width="100%" alt="image" />
    <h1>Welcome to My Website</h1>
    <p>This is my first web page.</p>
    <h1>Heading 1</h1>
    <h2>Heading 2</h2>
    <p>This is a paragraph.</p>
    <br>
    <hr>
    <strong>Bold Text</strong>
    <em>Italic Text</em> 
    <h2>My Favorite Fruits</h2>
    <ol>
        <li>Apple</li>
        <li>Banana</li>
        <li>Orange</li>
        <li>Grapes</li>
    </ol>
</body>
</html>
